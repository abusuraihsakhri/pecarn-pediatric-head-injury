name: PECARN tests and security checks

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[all]"
          python -m pip check
      - name: Compile Python sources
        run: python -m compileall -q pecarn_rule.py cli.py agents enrichment.py
      - name: Test Python and HTTP API
        run: python -m pytest -q
      - name: Test clinical CSV batch
        run: python -m pecarn_rule batch -i sample.csv -o results.csv

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check browser JavaScript
        run: node --check web/app.js
      - name: Test age-specific browser calculations
        run: node --test web/app.test.cjs
      - name: Smoke-test static entry point
        run: |
          python -m http.server 8765 --directory web >/tmp/pecarn-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          python - <<'PY'
          import time, urllib.request
          for attempt in range(20):
              try:
                  for path in ('/', '/app.js'):
                      with urllib.request.urlopen('http://127.0.0.1:8765' + path, timeout=5) as response:
                          assert response.status == 200
                  break
              except OSError:
                  time.sleep(0.2)
          else:
              raise SystemExit('Static site did not become available')
          PY
