[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pecarn-pediatric-head-injury"
version = "3.0.0"
description = "PECARN Pediatric Head Injury Rule - Clinical Decision Support for ciTBI Risk Stratification"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Dr. Abu Suraih Sakhri"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn>=0.30"]
test = ["pytest>=8.0"]
all = ["fastapi>=0.110", "uvicorn>=0.30", "pytest>=8.0"]

[project.scripts]
pecarn = "cli:main"

[tool.setuptools.packages.find]
include = ["agents*"]

[tool.pytest.ini_options]
testpaths = ["tests", "."]
python_files = ["test_*.py"]
